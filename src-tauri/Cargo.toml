[package]
name = "whichcraft"
version = "0.1.0"
description = "Windows developer tool discovery, switching, and installation"
authors = ["zigza"]
edition = "2021"
# The GUI; src/bin/whichcraft-cli.rs is the console launcher shipped as whichcraft.com.
default-run = "whichcraft"

[lib]
name = "whichcraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
dirs-next = "2"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "blocking"] }
winreg = "0.56"
msi = "0.10"
sha2 = "0.10"
zip = "9"
windows-sys = { version = "0.61", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security_Cryptography",
  "Win32_System_Console",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Environment",
  "Win32_System_RestartManager",
  "Win32_System_ApplicationInstallationAndServicing",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_NetworkManagement_NetManagement",
] }
